# Every push to main: run the tests, then deploy the Worker (pages + world) to Cloudflare.
# The deploy step waits for the CLOUDFLARE_API_TOKEN repository secret ("Edit Cloudflare Workers" token).
# n8n deploys itself: Render rebuilds it when n8n/ changes.
name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
